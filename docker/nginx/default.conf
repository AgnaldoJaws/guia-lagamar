map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https on;
}

map $http_x_forwarded_for $forwarded_for {
    default "$http_x_forwarded_for, $remote_addr";
    "" $remote_addr;
}

map $http_x_real_ip $real_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

server {
    listen 80;
    server_name passaronegro.com.br;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 32m;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_REAL_IP $real_ip;
        fastcgi_param HTTP_X_FORWARDED_FOR $forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* /(?:\.env|composer\.(?:json|lock)|package(?:-lock)?\.json|vite\.config\.js|artisan|server\.php)$ {
        deny all;
    }
}
